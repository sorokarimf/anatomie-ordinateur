.iso-svg path,.iso-svg circle{vector-effect:non-scaling-stroke}

.iso-halo{fill:var(--anatomy-halo);stroke:none;filter:blur(9px);opacity:var(--anatomy-halo-opacity);transform:translateY(3px)}
.iso-line{fill:none;stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight);stroke-linecap:round;stroke-linejoin:round}
.iso-line[data-tone="hi"]{stroke:var(--anatomy-hi)}
.iso-line[data-tone="mid"]{stroke:var(--anatomy-mid)}
.iso-line[data-tone="lo"]{stroke:var(--anatomy-lo)}
.iso-line[data-tone="faint"]{stroke:var(--anatomy-faint)}
.iso-line[data-tone="lit"]{stroke:var(--anatomy-lit)}
.iso-line[data-tone="red"]{stroke:var(--anatomy-red)}
.iso-line[data-tone="green"]{stroke:var(--anatomy-green)}
.iso-line[data-tone="blue"]{stroke:var(--anatomy-blue)}
.iso-line[data-dotted]{stroke-dasharray:.01 3.5;stroke-width:1}

.iso-wire[data-tone="mid"] .iso-wire-end{stroke:var(--anatomy-mid)}

.iso-dots[data-tone="mid"] circle{opacity:.45}
.iso-dots[data-tone="lo"] circle{opacity:.22}
.iso-dots[data-tone="faint"] circle{opacity:.12}
.iso-face-text{fill:var(--anatomy-mid);font-family:var(--anatomy-mono);letter-spacing:.04em}

.iso-face-text[data-tone="lo"]{fill:var(--anatomy-lo)}
.iso-face-text[data-tone="faint"]{fill:var(--anatomy-faint)}
.tb-body{fill:var(--anatomy-shade-2);stroke:none}
.tb-shine{fill:var(--anatomy-top);stroke:none}
.tb-shade{fill:var(--anatomy-shade-0);stroke:none}
.tb-ring{fill:none;stroke:var(--anatomy-lo);stroke-width:.45;stroke-linecap:butt;stroke-linejoin:round}
.tb-ring[data-tone="mid"]{stroke:var(--anatomy-mid)}
.tb-ring[data-tone="faint"]{stroke:var(--anatomy-faint)}
.tb-ring[data-tone="hi"]{stroke:var(--anatomy-hi)}
@keyframes iso-flow{to{stroke-dashoffset:-32}}
@keyframes iso-pulse{0%,100%{opacity:.18}12%{opacity:1}40%{opacity:.18}}
.iso-line[data-flow]{animation:iso-flow 1600ms linear infinite}
.iso-dots circle[data-pulse]{animation:iso-pulse 1600ms steps(1,end) infinite;animation-delay:var(--pulse-at,0ms)}
.iso-figure{margin:32px 0 36px}
.iso-plate{position:relative;padding:52px 24px;border-radius:0;background:var(--anatomy-card);box-shadow:0 0 0 1px var(--anatomy-mid);--anatomy-paper:var(--anatomy-card)}
.iso-plate-corners{position:absolute;inset:18px 20px;pointer-events:none}

.iso-plate-corner[data-corner="fig"]{top:0;left:0;color:var(--anatomy-text)}
.iso-plate-corner[data-corner="title"]{top:0;right:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="hint"]{bottom:0;left:0;text-transform:uppercase;letter-spacing:.1em}

.iso-plate .iso-svg{margin:0 auto}
.iso-legend{display:grid;gap:8px;margin-top:12px;color:var(--anatomy-muted);font-size:13px;line-height:1.55}
.iso-keys{display:flex;flex-wrap:wrap;gap:6px 18px}
.iso-key{display:inline-flex;align-items:center;gap:7px}
.iso-swatch{width:16px;height:10px;flex:none;overflow:visible}
.iso-swatch path{fill:none;stroke:var(--anatomy-hi);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.iso-swatch[data-mark="raised"] path,.iso-swatch[data-mark="flat"] path{stroke:var(--anatomy-mid)}

*{box-sizing:border-box}
html{color-scheme:dark}
body[data-theme="light"]{color-scheme:light}
body{margin:0;background:var(--anatomy-page);color:var(--anatomy-text);font:14px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.iso-page{width:min(860px,100% - 32px);margin:64px auto 96px}

  padding: 52px 20px 64px;
  overflow: hidden;
}

.lt-stage {
  position: relative;
  max-width: 640px;
  margin: 0 auto;
  border-radius: 10px;
  touch-action: pan-y;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  -webkit-user-select: none;
}

.lt-stage:focus-visible {
  outline: 1px solid var(--anatomy-muted);
  outline-offset: 6px;
}

.lt-svg {
  display: block;
  width: 100%;
  height: auto;
}

.lt-stage .it {
  cursor: pointer;
}

.lt-stage[data-focus] .it:not([data-on]):not([data-piece="stand"]) {
  --anatomy-hi: var(--anatomy-mid);
  --anatomy-mid: var(--anatomy-lo);
}

.lt-stage[data-focus] .it[data-piece="stand"] {
  --anatomy-mid: var(--anatomy-lo);
}

.it[data-on] {
  --anatomy-hi: var(--anatomy-lit);
  --anatomy-mid: var(--anatomy-hi);
}

.it[data-on] .iso-top {
  fill: var(--anatomy-lit-top);
}

.it[data-on] .iso-shade {
  fill: var(--anatomy-lit-shade);
}

.lt-screen {
  fill: var(--anatomy-shade-0);
  stroke: none;
}

.lt-win {
  fill: var(--anatomy-shade-2);
  stroke: none;
}

.lt-void {
  fill: var(--anatomy-shade-0);
  stroke: none;
}

.lt-dotpx {
  fill: none;
  stroke: var(--anatomy-mid);
  stroke-width: 2.4;
  stroke-linecap: round;
  vector-effect: non-scaling-stroke;
}

.lt-controls {
  position: absolute;
  left: 20px;
  bottom: 16px;
  display: flex;
  align-items: center;
  gap: 14px;
  font-family: var(--anatomy-mono);
  font-size: 10.5px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--anatomy-muted);
}

.lt-go {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  height: 28px;
  padding: 0 13px 0 11px;
  border: 0;
  border-radius: 999px;
  background: var(--anatomy-face);
  color: var(--anatomy-strong);
  font: inherit;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  cursor: pointer;
  box-shadow: inset 0 0 0 1px var(--lt-ring);
  transition: background 200ms var(--anatomy-ease), transform 160ms var(--anatomy-ease);
}

.lt-go:hover {
  background: var(--lt-hover);
}

.lt-go:active {
  transform: scale(0.97);
}

.lt-go:focus-visible {
  outline: 1px solid var(--anatomy-muted);
  outline-offset: 3px;
}

.lt-lamp {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--lt-lamp-off);
  transition: background 240ms var(--anatomy-ease), box-shadow 240ms var(--anatomy-ease);
}

.lt-go[data-state="on"] .lt-lamp {
  background: var(--lt-lamp-on);
  box-shadow: 0 0 10px 2px var(--lt-lamp-glow);
}

.lt-go[data-state="done"] .lt-lamp {
  background: var(--lt-lamp-done);
}

.iso.lt,
.lt {
  --lt-ring: #ffffff14;
  --lt-hover: #232323;
  --lt-lamp-off: #4a4a4a;
  --lt-lamp-on: #6be0a0;
  --lt-lamp-done: #6be0a0;
  --lt-lamp-glow: #6be0a088;
  --lt-part-ring: #ffffff10;
  --lt-part-hover: #ffffff0a;
}

[data-theme="light"] .lt,
[data-theme="light"].lt {
  --lt-ring: #0000001a;
  --lt-hover: #f0f0ed;
  --lt-lamp-off: #c4c4c4;
  --lt-lamp-on: #1f9d63;
  --lt-lamp-done: #1f9d63;
  --lt-lamp-glow: #1f9d6355;
  --lt-part-ring: #00000014;
  --lt-part-hover: #0000000a;
}

.lt-parts-list {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-bottom: 6px;
}

.lt-part {
  display: inline-flex;
  align-items: baseline;
  gap: 7px;
  padding: 5px 10px;
  border: 0;
  border-radius: 999px;
  background: transparent;
  color: var(--anatomy-muted);
  font: 12.5px/1.3 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  cursor: pointer;
  box-shadow: inset 0 0 0 1px var(--lt-part-ring);
  transition: color 160ms var(--anatomy-ease), background 160ms var(--anatomy-ease);
}

.lt-part:hover,
.lt-part:focus-visible,
.lt-part[data-on] {
  color: var(--anatomy-strong);
  background: var(--lt-part-hover);
  outline: none;
}

.lt-num {
  font-family: var(--anatomy-mono);
  font-size: 10px;
  color: var(--anatomy-muted);
}

.lt-desc {
  display: block;
  min-height: 3.2em;
}

.lt-live {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip-path: inset(50%);
  white-space: nowrap;
}

@media (max-width: 640px) {
  .lt .iso-plate {
    padding: 48px 8px 88px;
  }

  .lt .iso-plate-corner[data-corner="readout"] {
    bottom: 46px;
    right: 0;
    max-width: 100%;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .lt-controls {
    left: 14px;
    bottom: 14px;
    gap: 10px;
    max-width: calc(100% - 28px);
    flex-wrap: wrap;
  }

  .lt-hint {
    font-size: 9.5px;
    letter-spacing: 0.06em;
    line-height: 1.3;
  }
}

@media (prefers-reduced-motion: reduce) {
  .lt * {
    transition: none !important;
  }
}

const ELEVATION = 30;

const ringOf = (plan, steps = 8) => roundedPlan(plan, steps);

const planOutline = (plan, z, projection, steps = 8) => onTop(ringOf(plan, steps), z, projection, true);
const lineOnTop = (from, to, z, projection) => onTop([from, to], z, projection);
const segment = (from, to, projection) => pathOf([iso(from, projection), iso(to, projection)]);
const rise = (at, from, to, projection) => segment([at[0], at[1], from], [at[0], at[1], to], projection);

`;
const D = {"cam":{"full":[0,0,720,900],"tight":[18.33854054693836,285.5227060428099,536.5405159163562,670.6756448954452]},"W":720,"H":900,"P":{"origin":[286.60879850511645,761.414254656717],"scale":1.1474832224976725,"azimuth":36,"elevation":24},"V":[0.7390738003669028,0.536968547301099,0.4067366430758002],"EX":[0.8531492650790824,0.47761425483724906],"EY":[-1.1742592239181135,0.3470070681208881],"EZ":[0,-1.3259785487375666],"fan":{"x":60,"y":-26,"z":18.200000000000003},"pieces":{"base":{"name":"Coque inférieure","say":"coque inférieure · le châssis, quatre pieds","desc":"Le châssis porte tout le reste. Quatre pieds en caoutchouc l'isolent de la table, des bossages reçoivent les vis, et des découpes sur le côté laissent sortir les ports."},"battery":{"name":"Batterie","say":"batterie · cellules lithium-ion, 8 à 12 h","desc":"Un pack plat de cellules lithium-ion stocke l'énergie, environ 50 à 70 Wh. Elle occupe l'avant de la machine, sous le repose-poignets."},"board":{"name":"Carte mère","say":"carte mère · relie tous les composants","desc":"Une plaque de circuits imprimés relie le processeur, la mémoire et le stockage par des milliers de pistes de cuivre. Les ports USB, HDMI et audio sont soudés sur son bord."},"cpu":{"name":"Processeur","say":"processeur · des milliards de transistors","desc":"Le CPU exécute les instructions du programme en boucle : chercher, décoder, exécuter, des milliards de fois par seconde. Il chauffe beaucoup, donc il porte un répartiteur de chaleur."},"ram":{"name":"Mémoire vive","say":"mémoire vive · deux barrettes","desc":"La RAM garde ce qui sert maintenant : programmes ouverts, documents en cours. Très rapide, mais elle se vide quand on éteint la machine."},"ssd":{"name":"SSD","say":"SSD · stockage durable","desc":"Le SSD conserve le système et vos fichiers, même éteint. Plus lent que la RAM mais sans pièce mobile. Format M.2, enfiché d'un côté et vissé de l'autre."},"cooling":{"name":"Refroidissement","say":"refroidissement · caloduc et ventilateur","desc":"Le processeur chauffe. Une plaque et un caloduc conduisent la chaleur vers des ailettes, et le ventilateur souffle l'air au travers pour le faire sortir sur le côté."},"deck":{"name":"Clavier et coque supérieure","say":"clavier et pavé tactile · vos entrées","desc":"La coque supérieure ferme la machine et porte vos entrées : le clavier, le pavé tactile et les haut-parleurs. Elle se visse sur le châssis."},"lid":{"name":"Écran","say":"écran · dalle, charnières, webcam","desc":"Une dalle LCD ou OLED sous une vitre, avec la webcam dans le cadre. Deux charnières la relient à la base et permettent de l'ouvrir à l'angle voulu."},"stand":{"name":"Table","say":""}},"stagger":["lid","deck","cooling","ssd","ram","cpu","board","battery","base","stand"],"spring":{"stagger":0.05,"stiffness":64,"damping":14.2,"substeps":4},"order":["base","battery","board","cpu","ram","ssd","cooling","deck","lid"]};
const CAPTION = "Un ordinateur portable se monte par couches. Le châssis reçoit la batterie et la carte mère ; sur la carte viennent le processeur, la mémoire, le stockage et le refroidissement ; la coque supérieure referme le tout, et l'écran se fixe à l'arrière par ses charnières.";
const root = document.querySelector(".lt");
const stage = root.querySelector(".lt-stage");
const parts = stage.querySelector(".lt-parts");
const readout = root.querySelector("[data-readout]");
const desc = root.querySelector("[data-desc]");
const live = root.querySelector("[data-live]");
const goButton = root.querySelector("[data-go]");
const goLabel = root.querySelector("[data-go-label]");
const hint = root.querySelector(".lt-hint");
const partButtons = [...root.querySelectorAll(".lt-part")];
const fanGroup = parts.querySelector("[data-fan]");
const screenGroup = parts.querySelector("[data-screen] > g");
const still = matchMedia("(prefers-reduced-motion: reduce)");

const nodes = [...parts.querySelectorAll(".it")].map((el) => ({
  el,
  piece: el.dataset.piece,
  key: Number(el.dataset.k),
  m: el.dataset.m.split(",").map(Number),
  shown: "",
}));
for (const node of nodes) node.lift = node.m[0] * D.V[0] + node.m[1] * D.V[1] + node.m[2] * D.V[2];
let order = nodes.map((_, index) => index);

const ORDER = D.order;
const COUNT = ORDER.length;
const STAGGER = D.stagger;
const SPRING = D.spring;
const piece = Object.fromEntries(STAGGER.map((id) => [id, { x: id === "stand" ? 0 : 1, v: 0, target: id === "stand" ? 0 : 1, pending: null }]));
const clamp = (value, low, high) => Math.min(high, Math.max(low, value));
const smooth = (value) => {
  const t = clamp(value, 0, 1);
  return t * t * (3 - 2 * t);
};

const STEP = 1.7;
let clock = 0;
let installed = 0;
let auto = false;
let nextAt = 0;
let mode = "apart";
let hovered = null;
let pinned = null;
let selected = null;
let touring = !still.matches;
let tourAt = -1;
let leaveTimer = 0;
let fanAngle = 0;
let visible = false;
let frame = 0;
let last = 0;
let announced = "";

function say(text) {
  if (readout.textContent !== text) readout.textContent = text;
}
function announce(text) {
  if (announced !== text) {
    announced = text;
    live.textContent = text;
  }
}

function status() {
  const focus = hovered || pinned;
  if (focus) return D.pieces[focus].say;
  if (mode === "assembling") return `montage · ${installed}/${COUNT} · ${D.pieces[ORDER[Math.max(0, installed - 1)]].name.toLowerCase()}`;
  if (mode === "assembled") return "monté · machine complète";
  if (mode === "disassembling") return "démontage…";
  return installed > 0 ? `${installed}/${COUNT} montés` : `éclaté · ${COUNT} composants`;
}

function refresh() {
  const autoId = auto && installed > 0 ? ORDER[installed - 1] : null;
  const next = hovered || pinned || autoId;
  if (next !== selected) {
    selected = next;
    for (const node of nodes) {
      if (selected && node.piece === selected) node.el.setAttribute("data-on", "");
      else node.el.removeAttribute("data-on");
    }
    if (selected) stage.setAttribute("data-focus", "");
    else stage.removeAttribute("data-focus");
    partButtons.forEach((button) => (button.dataset.part === selected ? button.setAttribute("data-on", "") : button.removeAttribute("data-on")));
    desc.textContent = selected ? D.pieces[selected].desc : CAPTION;
    stage.setAttribute("aria-valuenow", String(selected ? ORDER.indexOf(selected) + 1 : 0));
  }
  const text = status();
  say(text);
  if (stage.getAttribute("aria-valuetext") !== text) stage.setAttribute("aria-valuetext", text);
  let label = "Monter";
  if (installed === COUNT && !auto) label = "Démonter";
  else if (auto) label = "Pause";
  if (goLabel.textContent !== label) goLabel.textContent = label;
  goButton.dataset.state = auto ? "on" : installed === COUNT ? "done" : "off";
  hint.textContent = installed > 0 && installed < COUNT && !auto ? "Montage en pause · Monter pour continuer" : "Survolez une pièce pour la découvrir";
}

function target(id, value, delay = 0) {
  const state = piece[id];
  if (state.target === value && !state.pending) return;
  state.pending = { value, at: clock + (still.matches ? 0 : delay) };
}

function disassemble() {
  auto = false;
  installed = 0;
  mode = "disassembling";
  STAGGER.forEach((id, index) => {
    if (id !== "stand") target(id, 1, index * SPRING.stagger);
  });
  announce("démontage");
  refresh();
  run();
}

function installNext() {
  if (installed >= COUNT) return;
  installed += 1;
  target(ORDER[installed - 1], 0);
  announce(`étape ${installed} sur ${COUNT} · ${D.pieces[ORDER[installed - 1]].name}`);
}

function assemble() {
  if (installed >= COUNT) installed = 0;
  auto = true;
  mode = "assembling";
  nextAt = clock;
  refresh();
  run();
}

function toggleGo() {
  touring = false;
  if (auto) {
    auto = false;
    mode = "apart";
  } else if (installed === COUNT) disassemble();
  else assemble();
  refresh();
  run();
}

function springStep(state, dt, calm) {
  if (state.pending && clock >= state.pending.at) {
    state.target = state.pending.value;
    state.pending = null;
  }
  if (calm) {
    state.x = state.target;
    state.v = 0;
    return false;
  }
  for (let index = 0; index < SPRING.substeps; index++) {
    const h = dt / SPRING.substeps;
    state.v += ((state.target - state.x) * SPRING.stiffness - state.v * SPRING.damping) * h;
    state.x += state.v * h;
  }
  if (Math.abs(state.target - state.x) < 2e-4 && Math.abs(state.v) < 2e-4) {
    state.x = state.target;
    state.v = 0;
    return state.pending !== null;
  }
  return true;
}

function bladesOf(angle) {
  const out = [];
  const z = D.fan.z;
  for (let i = 0; i < 9; i++) {
    const a0 = angle + (i * Math.PI * 2) / 9;
    const pts = [];
    for (let s = 0; s <= 6; s++) {
      const r = 5.6 + (s / 6) * 14.2;
      const a = a0 + (s / 6) * 0.9;
      pts.push([D.fan.x + Math.sin(a) * r, D.fan.y - Math.cos(a) * r]);
    }
    out.push(onTop(pts, z, D.P));
  }
  return lineSvg(out.join(""), { tone: "mid" });
}

function place() {
  for (const node of nodes) {
    const share = piece[node.piece].x;
    const tx = (D.EX[0] * node.m[0] + D.EY[0] * node.m[1] + D.EZ[0] * node.m[2]) * share;
    const ty = (D.EX[1] * node.m[0] + D.EY[1] * node.m[1] + D.EZ[1] * node.m[2]) * share;
    const text = Math.abs(share) < 1e-4 ? "" : `translate(${tx.toFixed(2)} ${ty.toFixed(2)})`;
    if (text !== node.shown) {
      node.shown = text;
      if (text) node.el.setAttribute("transform", text);
      else node.el.removeAttribute("transform");
    }
  }
  const next = nodes.map((_, index) => index).sort((a, b) => nodes[a].key + nodes[a].lift * piece[nodes[a].piece].x - (nodes[b].key + nodes[b].lift * piece[nodes[b].piece].x));
  if (next.some((index, at) => index !== order[at])) {
    const fragment = document.createDocumentFragment();
    for (const index of next) fragment.appendChild(nodes[index].el);
    parts.appendChild(fragment);
    order = next;
  }
  if (screenGroup) screenGroup.style.opacity = (0.16 + 0.84 * (1 - smooth(piece.lid.x * 5))).toFixed(3);
}

const svgEl = stage.querySelector("svg");
let viewKey = "";
function frameView() {
  let e = 0;
  for (const id of ORDER) e = Math.max(e, piece[id].x);
  const t = smooth(e * 1.15);
  const v = D.cam.tight.map((value, index) => value + (D.cam.full[index] - value) * t);
  const text = v.map((value) => value.toFixed(2)).join(" ");
  if (text !== viewKey) {
    viewKey = text;
    svgEl.setAttribute("viewBox", text);
  }
}

function tick(now) {
  const dt = last ? Math.min((now - last) / 1000, 1 / 30) : 1 / 60;
  last = now;
  clock += dt;
  const calm = still.matches;
  let moving = false;
  for (const id of STAGGER) if (springStep(piece[id], dt, calm)) moving = true;
  if (auto && clock >= nextAt) {
    if (installed < COUNT) {
      installNext();
      nextAt = clock + STEP;
      refresh();
    } else if (!moving) {
      auto = false;
      mode = "assembled";
      announce("machine complète");
      refresh();
      if (touring) tourAt = clock + 2.8;
    }
  }
  if (mode === "disassembling" && !moving) {
    mode = "apart";
    refresh();
    if (touring) tourAt = clock + 2.2;
  }
  if (touring && tourAt >= 0 && clock >= tourAt) {
    tourAt = -1;
    if (installed === COUNT) disassemble();
    else assemble();
  }
  const spin = !calm && (moving || selected === "cooling");
  if (spin) {
    fanAngle += dt * 5;
    fanGroup.innerHTML = bladesOf(fanAngle);
  }
  place();
  frameView();
  frame = visible && (moving || auto || spin || (touring && tourAt >= 0) || (touring && tourAt === -1 && mode === "apart" && clock < 1.4)) ? requestAnimationFrame(tick) : 0;
}
const run = () => {
  if (!frame && visible) {
    last = 0;
    frame = requestAnimationFrame(tick);
  }
};

function focusOn(id, source) {
  touring = false;
  if (source === "hover") hovered = id;
  else pinned = pinned === id ? null : id;
  refresh();
  run();
}

stage.addEventListener("pointerover", (event) => {
  const item = event.target.closest(".it");
  const id = item && item.dataset.piece !== "stand" ? item.dataset.piece : null;
  clearTimeout(leaveTimer);
  if (id !== hovered) {
    touring = id ? false : touring;
    hovered = id;
    refresh();
    run();
  }
});
stage.addEventListener("pointerleave", () => {
  clearTimeout(leaveTimer);
  leaveTimer = setTimeout(() => {
    hovered = null;
    refresh();
  }, 160);
});
stage.addEventListener("pointerdown", () => {
  touring = false;
});
stage.addEventListener("click", (event) => {
  const item = event.target.closest(".it");
  if (item && item.dataset.piece !== "stand") focusOn(item.dataset.piece, "pin");
});
partButtons.forEach((button) => {
  button.addEventListener("click", () => focusOn(button.dataset.part, "pin"));
  button.addEventListener("pointerenter", () => {
    touring = false;
    hovered = button.dataset.part;
    refresh();
    run();
  });
  button.addEventListener("pointerleave", () => {
    hovered = null;
    refresh();
  });
});
goButton.addEventListener("click", toggleGo);
stage.addEventListener("keydown", (event) => {
  const index = pinned ? ORDER.indexOf(pinned) : -1;
  let handled = true;
  touring = false;
  if (event.key === "ArrowRight" || event.key === "ArrowDown") pinned = ORDER[(index + 1) % COUNT];
  else if (event.key === "ArrowLeft" || event.key === "ArrowUp") pinned = ORDER[(index <= 0 ? COUNT : index) - 1];
  else if (event.key === "Home") pinned = ORDER[0];
  else if (event.key === "End") pinned = ORDER[COUNT - 1];
  else if (event.key === "Escape") pinned = null;
  else if (event.key === " " || event.key === "Enter") toggleGo();
  else handled = false;
  if (handled) {
    event.preventDefault();
    refresh();
    run();
  }
});

new IntersectionObserver(
  (entries) => {
    visible = entries[entries.length - 1].isIntersecting;
    if (visible) run();
  },
  { rootMargin: "120px 0px" },
).observe(stage);

if (touring) tourAt = 1.4;
window.__laptop = {
  show(count) {
    touring = false;
    auto = false;
    installed = count;
    ORDER.forEach((id, index) => {
      piece[id].x = piece[id].target = index < count ? 0 : 1;
      piece[id].v = 0;
      piece[id].pending = null;
    });
    mode = count === COUNT ? "assembled" : count === 0 ? "apart" : "assembling";
    refresh();
    place();
    frameView();
  },
  select(id) {
    pinned = id;
    refresh();
  },
};
refresh();
place();
frameView();
